name: Build AERA Recovery for Xiaomi 12X (psyche)

on:
  workflow_dispatch:
    inputs:
      manifest_branch:
        description: 'AERA Manifest branch (leave blank to auto-detect default branch)'
        required: false
        default: ''
      dtbo_url:
        description: 'Optional direct URL to stock dtbo.img (leave blank if not needed)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Free Up Runner Disk Space (Maximize ~100GB)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Configure 16GB Swap File
        run: |
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          df -h

      - name: Install Android Build Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl wget zlib1g-dev \
            libc6-dev-i386 x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils \
            xsltproc unzip fontconfig python3 python-is-python3 bc cpio libssl-dev libelf-dev \
            lz4 zstd device-tree-compiler rsync ccache

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          path: psyche_tree

      - name: Extract Verified Xiaomi 12X (psyche) AERA Device Tree
        run: |
          mkdir -p psyche_tree
          if [ ! -f "psyche_tree/BoardConfig.mk" ]; then
            echo "" | base64 -d | tar -xzf - -C psyche_tree
          fi
          ls -la psyche_tree

      - name: Build Prebuilt Kernel & DTB if not committed in repo
        run: |
          if [ ! -f "psyche_tree/prebuilt/kernel" ] || [ ! -f "psyche_tree/prebuilt/dtb" ]; then
            echo "[*] Compiling Xiaomi 12X (psyche) prebuilt kernel & DTB..."
            mkdir -p /tmp/kbuild && cd /tmp/kbuild
            wget -q -O clang.tar.gz "https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260807-release/Clang-16.0.6-20260807.tar.gz"
            mkdir -p zyc-clang && tar -zxf clang.tar.gz -C zyc-clang
            export PATH="/tmp/kbuild/zyc-clang/bin:$PATH"
            git clone --depth=1 -b android17-aptusitu https://github.com/AstideLabs/android_kernel_xiaomi_sm8250.git kernel_sm8250 || \
            git clone --depth=1 https://github.com/crdroidandroid/android_kernel_xiaomi_sm8250.git -b 16.0-psyche kernel_sm8250
            cd kernel_sm8250
            mkdir -p out
            if [ -f "arch/arm64/configs/vendor/xiaomi/psyche.config" ]; then
              make O=out ARCH=arm64 SUBARCH=arm64 vendor/kona-perf_defconfig vendor/xiaomi/sm8250-common.config vendor/xiaomi/psyche.config
            else
              CFG=$(find arch/arm64/configs -name "*psyche*" -o -name "*kona*" | head -n 1 | sed 's|arch/arm64/configs/||')
              make O=out ARCH=arm64 SUBARCH=arm64 "$CFG"
            fi
            make -j$(nproc --all) O=out ARCH=arm64 CC="ccache clang" HOSTCC=clang HOSTCXX=clang++ \
              CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
              LLVM=1 LLVM_IAS=1 Image dtbs
            mkdir -p "${{ github.workspace }}/psyche_tree/prebuilt"
            cp -pf out/arch/arm64/boot/Image "${{ github.workspace }}/psyche_tree/prebuilt/kernel"
            cat $(find out/arch/arm64/boot/dts -name "*.dtb") > "${{ github.workspace }}/psyche_tree/prebuilt/dtb"
          fi
          ls -lh "${{ github.workspace }}/psyche_tree/prebuilt/"

      - name: Fetch Optional DTBO
        if: ${{ github.event.inputs.dtbo_url != '' }}
        run: |
          curl -L "${{ github.event.inputs.dtbo_url }}" -o psyche_tree/prebuilt/dtbo.img

      - name: Sync AERA Recovery Manifest
        run: |
          git config --global user.name "Abed El-Reda"
          git config --global user.email "abed.reda.matar@gmail.com"
          mkdir -p ~/bin ~/aera
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          export PATH="$HOME/bin:$PATH"
          cd ~/aera
          if [ -n "${{ github.event.inputs.manifest_branch }}" ]; then
            repo init --depth=1 -u https://github.com/AERA-Recovery/android_manifest.git -b "${{ github.event.inputs.manifest_branch }}"
          else
            DEFAULT_BRANCH=$(git ls-remote --symref https://github.com/AERA-Recovery/android_manifest.git HEAD | awk '/^ref:/ {sub(/refs\/heads\//, "", $2); print $2}')
            echo "Detected default manifest branch: $DEFAULT_BRANCH"
            repo init --depth=1 -u https://github.com/AERA-Recovery/android_manifest.git -b "${DEFAULT_BRANCH:-main}"
          fi
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Copy Device Tree & Build Recovery
        run: |
          cd ~/aera
          mkdir -p device/xiaomi/psyche
          cp -a ${{ github.workspace }}/psyche_tree/. device/xiaomi/psyche/
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL="C"
          source build/envsetup.sh
          lunch twrp_psyche-eng
          mka adbd recoveryimage

      - name: Package Flashable Recovery Output
        run: |
          mkdir -p ${{ github.workspace }}/output_artifacts
          cp -v ~/aera/out/target/product/psyche/*.zip ${{ github.workspace }}/output_artifacts/ 2>/dev/null || true
          cp -v ~/aera/out/target/product/psyche/recovery.img ${{ github.workspace }}/output_artifacts/ 2>/dev/null || true
          cp -v ~/aera/out/target/product/psyche/boot.img ${{ github.workspace }}/output_artifacts/ 2>/dev/null || true
          ls -lh ${{ github.workspace }}/output_artifacts/

      - name: Upload AERA Recovery Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AERA-Recovery-psyche
          path: ${{ github.workspace }}/output_artifacts/*
